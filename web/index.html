<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>my-flow dashboard</title>
  <script>try{var t=localStorage.getItem('my-flow.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-name">my-flow</span>
        <span class="brand-sub mono" id="root-label" title="project root">loading</span>
      </div>
      <ul class="nav-list">
        <li><a href="#/changes" data-nav="changes">Changes</a></li>
        <li><a href="#/specs" data-nav="specs">Specs</a></li>
        <li><a href="#/archive" data-nav="archive">Archive</a></li>
        <li><a href="#/scratch" data-nav="scratch">Scratch</a></li>
        <li id="nav-diff" hidden><a href="#/diff" data-nav="diff">Diff</a></li>
      </ul>
      <div class="theme">
        <span class="theme-label" id="theme-label">Theme</span>
        <div class="listbox" id="theme-listbox" data-value="system">
          <button type="button" class="listbox-trigger" id="theme-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu" aria-labelledby="theme-label theme-trigger" title="follow or override the system colour scheme">
            <span class="listbox-value">Auto (system)</span><span class="listbox-caret" aria-hidden="true">&#9662;</span>
          </button>
          <ul class="listbox-menu" id="theme-menu" role="listbox" aria-labelledby="theme-label" hidden>
            <li class="listbox-option" role="option" id="theme-opt-system" data-value="system" aria-selected="true">Auto (system)</li>
            <li class="listbox-option" role="option" id="theme-opt-light" data-value="light">Light</li>
            <li class="listbox-option" role="option" id="theme-opt-dark" data-value="dark">Dark</li>
          </ul>
        </div>
      </div>
      <a href="#/styleguide" data-nav="styleguide" class="sg-link">Styleguide</a>
      <div class="conn mono" id="conn" data-state="connecting" title="live update connection">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">connecting</span>
      </div>
    </nav>
    <main id="view" class="content" aria-live="polite">
      <p class="muted">Loading</p>
    </main>
  </div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
